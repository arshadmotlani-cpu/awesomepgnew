<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand concepts — review only</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
        padding: 2rem;
      }
      h1 { font-size: 1.25rem; font-weight: 600; }
      p { color: #a3a3a3; max-width: 42rem; line-height: 1.5; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }
      figure {
        margin: 0;
        padding: 1rem;
        border: 1px solid #262626;
        border-radius: 12px;
        background: #141414;
      }
      figcaption { margin-top: 0.75rem; font-size: 0.85rem; }
      .sizes { display: flex; gap: 0.75rem; align-items: flex-end; margin-top: 0.75rem; }
      .sizes img { image-rendering: auto; }
      .note { font-size: 0.75rem; color: #737373; margin-top: 0.35rem; }
    </style>
  </head>
  <body>
    <h1>Brand mark concepts (not wired into the app)</h1>
    <p>
      Open this file locally or via <code>/brand-concepts/index.html</code> after deploy.
      Confirm the product list and which marks you like before we replace favicons / chrome.
    </p>
    <div class="grid">
      <figure>
        <div class="sizes">
          <img src="01-fyhair-scissors.svg" width="64" height="64" alt="FYH 64" />
          <img src="01-fyhair-scissors.svg" width="32" height="32" alt="FYH 32" />
          <img src="01-fyhair-scissors.svg" width="16" height="16" alt="FYH 16" />
        </div>
        <figcaption><strong>For Your Hair</strong> — scissors arcs on bottle green</figcaption>
        <p class="note">Replaces purple FY monogram direction for salon product.</p>
      </figure>
      <figure>
        <div class="sizes">
          <img src="02-awesomepg-bed-key.svg" width="64" height="64" alt="APG 64" />
          <img src="02-awesomepg-bed-key.svg" width="32" height="32" alt="APG 32" />
          <img src="02-awesomepg-bed-key.svg" width="16" height="16" alt="APG 16" />
        </div>
        <figcaption><strong>Awesome PG</strong> — bed + key (exact-bed booking)</figcaption>
        <p class="note">Not a house icon; grounded in bed inventory.</p>
      </figure>
      <figure>
        <div class="sizes">
          <img src="03-capital-ledger-bars.svg" width="64" height="64" alt="Capital 64" />
          <img src="03-capital-ledger-bars.svg" width="32" height="32" alt="Capital 32" />
          <img src="03-capital-ledger-bars.svg" width="16" height="16" alt="Capital 16" />
        </div>
        <figcaption><strong>Automotive Capital</strong> — ledger / TVI bars</figcaption>
      </figure>
      <figure>
        <div class="sizes">
          <img src="04-owner-os-ring.svg" width="64" height="64" alt="Owner 64" />
          <img src="04-owner-os-ring.svg" width="32" height="32" alt="Owner 32" />
          <img src="04-owner-os-ring.svg" width="16" height="16" alt="Owner 16" />
        </div>
        <figcaption><strong>Owner OS</strong> — open net-worth ring</figcaption>
      </figure>
      <figure>
        <div class="sizes">
          <img src="05-platform-nodes.svg" width="64" height="64" alt="Platform 64" />
          <img src="05-platform-nodes.svg" width="32" height="32" alt="Platform 32" />
          <img src="05-platform-nodes.svg" width="16" height="16" alt="Platform 16" />
        </div>
        <figcaption><strong>Platform</strong> — structural node grid (parent)</figcaption>
      </figure>
    </div>
  </body>
</html>
