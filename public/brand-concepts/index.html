<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brand mark concepts — review</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; color: #eee; margin: 0; padding: 32px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #999; max-width: 52rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 28px; }
    figure { margin: 0; padding: 16px; border: 1px solid #222; border-radius: 12px; background: #111; }
    figcaption { margin-top: 12px; font-size: 0.85rem; }
    figcaption strong { display: block; color: #fff; margin-bottom: 4px; }
    img { width: 64px; height: 64px; image-rendering: auto; }
    .tiny { width: 24px; height: 24px; margin-left: 12px; vertical-align: middle; }
    .note { margin-top: 32px; font-size: 0.85rem; color: #777; }
  </style>
</head>
<body>
  <h1>Product mark concepts (for approval)</h1>
  <p>Not wired into the app yet. Each mark is shown at 64px and 24px (favicon scale).</p>
  <div class="grid">
    <figure>
      <img src="fyh-salon-mark.svg" alt="" /><img class="tiny" src="fyh-salon-mark.svg" alt="" />
      <figcaption><strong>For Your Hair / Salon SaaS</strong> Bottle-green + brass scissors — sales-page language, not the purple FY monogram.</figcaption>
    </figure>
    <figure>
      <img src="awesome-pg-mark.svg" alt="" /><img class="tiny" src="awesome-pg-mark.svg" alt="" />
      <figcaption><strong>Awesome PG (customer)</strong> Room + bed + availability dot — grounded in bed booking, not a generic house.</figcaption>
    </figure>
    <figure>
      <img src="apg-os-mark.svg" alt="" /><img class="tiny" src="apg-os-mark.svg" alt="" />
      <figcaption><strong>APG OS (PG admin)</strong> Shield + A — operations/admin for the PG product.</figcaption>
    </figure>
    <figure>
      <img src="platform-saas-mark.svg" alt="" /><img class="tiny" src="platform-saas-mark.svg" alt="" />
      <figcaption><strong>Platform Admin (parent SaaS)</strong> Neutral structural nodes — multi-tenant system behind the products.</figcaption>
    </figure>
    <figure>
      <img src="capital-os-mark.svg" alt="" /><img class="tiny" src="capital-os-mark.svg" alt="" />
      <figcaption><strong>Automotive Capital</strong> Rising ledger bars — portfolio/growth.</figcaption>
    </figure>
    <figure>
      <img src="owner-os-mark.svg" alt="" /><img class="tiny" src="owner-os-mark.svg" alt="" />
      <figcaption><strong>Owner OS / Wealth</strong> Net-worth dial — currently has no dedicated mark in the codebase.</figcaption>
    </figure>
  </div>
  <p class="note">Open this file via <code>/brand-concepts/</code> on a running app, or open the SVGs directly in the repo under <code>public/brand-concepts/</code>.</p>
</body>
</html>
